openapi: '3.0.3'
info:
  version: 1.0.0
  title: Array header parameters
  description: A header parameter holding an array (simple style)
paths:
  /tagged:
    get:
      operationId: getTagged
      parameters:
        - name: X-Tags
          in: header
          required: true
          schema:
            type: array
            items:
              type: string
      responses:
        '204':
          description: No content
