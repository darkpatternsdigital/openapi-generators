openapi: '3.0.3'
info:
  version: 1.0.0
  title: Multipart request bodies
  description: A multipart/form-data request body with a text part and a binary part
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                description:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '204':
          description: Received
