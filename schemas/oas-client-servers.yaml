openapi: '3.0.3'
info:
  version: 1.0.0
  title: Servers
  description: A server URL with a base path and a server variable
servers:
  - url: https://{region}.example.com/v1
    variables:
      region:
        default: us
        enum:
          - us
          - eu
paths:
  /items:
    get:
      operationId: listItems
      responses:
        '204':
          description: No content
