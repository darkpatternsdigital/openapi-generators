openapi: '3.0.3'
info:
  version: 1.0.0
  title: HTTP methods
  description: Every HTTP method an OpenAPI 3.0 Path Item can declare, except trace
paths:
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getItem
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                type: string
    put:
      operationId: putItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '204':
          description: Replaced
    post:
      operationId: postItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '204':
          description: Updated
    delete:
      operationId: deleteItem
      responses:
        '204':
          description: Deleted
    patch:
      operationId: patchItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: The patched item
          content:
            application/json:
              schema:
                type: string
    head:
      operationId: headItem
      responses:
        '200':
          description: The item exists
          headers:
            X-Item-Size:
              schema:
                type: string
    options:
      operationId: optionsItem
      responses:
        '204':
          description: The allowed methods
          headers:
            Allow:
              schema:
                type: string
