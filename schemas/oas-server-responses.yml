openapi: '3.0.3'
info:
  version: 1.0.0
  title: Responses
  description: Response ranges, default responses, multiple media types and response headers
paths:
  /ranges:
    get:
      operationId: getRanges
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
        '2XX':
          description: Any other success
          content:
            application/json:
              schema:
                type: string
        '4XX':
          description: Any client error
          content:
            application/json:
              schema:
                type: string
  /default:
    get:
      operationId: getDefault
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /media-types:
    get:
      operationId: getMediaTypes
      responses:
        '200':
          description: The greeting
          content:
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
  /headers:
    get:
      operationId: getHeaders
      responses:
        '200':
          description: OK
          headers:
            X-Rate-Limit:
              required: true
              schema:
                type: integer
            X-Request-Id:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
  /ref:
    get:
      operationId: getRef
      responses:
        '200':
          $ref: '#/components/responses/Greeting'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Greeting:
      description: The greeting
      content:
        application/json:
          schema:
            type: string
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - code
      properties:
        code:
          type: string
