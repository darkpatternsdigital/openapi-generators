openapi: '3.0.2'
info:
  title: OneOf Example
  version: '1.0'

components:
  schemas:
    Dog:
      type: object
      properties:
        bark:
          type: boolean
        breed:
          type: string
      required:
        - bark
        - breed
    Cat:
      type: object
      properties:
        hunts:
          type: boolean
        age:
          type: integer
      required:
        - hunts
        - age
    Pet:
      oneOf:
      - $ref: '#/components/schemas/Cat'
      - $ref: '#/components/schemas/Dog'
    IdOrName:
      oneOf:
      - type: integer
        format: int64
      - type: string
    DeclaredDog:
      type: object
      properties:
        petType:
          type: string
        bark:
          type: boolean
      required:
        - petType
        - bark
    DeclaredCat:
      type: object
      properties:
        petType:
          type: string
        hunts:
          type: boolean
      required:
        - petType
        - hunts
    DeclaredPet:
      # Each case declares the discriminator property
      oneOf:
      - $ref: '#/components/schemas/DeclaredCat'
      - $ref: '#/components/schemas/DeclaredDog'
      discriminator:
        propertyName: petType
        mapping:
          dog: '#/components/schemas/DeclaredDog'
          cat: '#/components/schemas/DeclaredCat'
    SpecifiedPet:
      required:
      - petType
      oneOf:
      - $ref: '#/components/schemas/Cat'
      - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: petType
        mapping:
          dog: '#/components/schemas/Dog'
          cat: '#/components/schemas/Cat'
paths:
  /pet:
    get:
      operationId: getRandomPet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    post:
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecifiedPet'
      responses:
        '200':
          description: OK
  /id-or-name:
    get:
      operationId: getIdOrName
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdOrName'
  /declared-pet:
    post:
      operationId: addDeclaredPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclaredPet'
      responses:
        '200':
          description: OK
