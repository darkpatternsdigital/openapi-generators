openapi: '3.0.3'
info:
  version: 1.0.0
  title: Path-level parameters
  description: Parameters declared on the Path Item apply to every operation on that path
paths:
  /widgets/{widgetId}:
    parameters:
      - name: widgetId
        in: path
        required: true
        schema:
          type: string
      - name: verbose
        in: query
        schema:
          type: boolean
    get:
      operationId: getWidget
      responses:
        '200':
          description: The widget
          content:
            application/json:
              schema:
                type: string
    delete:
      operationId: deleteWidget
      parameters:
        # Overrides the path-level parameter with the same name and location
        - name: verbose
          in: query
          required: true
          schema:
            type: boolean
        - name: reason
          in: query
          schema:
            type: string
      responses:
        '204':
          description: Deleted
